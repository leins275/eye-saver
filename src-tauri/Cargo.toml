[package]
name = "eye-saver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Eye Saver — 20-20-20 break reminders with a HUD timer and a break veil"

[lib]
name = "eye_saver_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
eye-core = { path = "../crates/eye-core" }
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
# Used directly on Windows to write a quoted exe path; see src/autostart.rs.
auto-launch = "0.6"
